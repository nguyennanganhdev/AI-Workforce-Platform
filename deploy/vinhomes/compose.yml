name: vinhomes

x-python-health: &python-health
  interval: 15s
  timeout: 8s
  retries: 5
  start_period: 30s

services:
  api:
    image: vinhomes-api:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/vinhomes-api/Dockerfile
    restart: unless-stopped
    environment:
      VINHOMES_API_DATABASE_URL: ${VINHOMES_API_DATABASE_URL:?restricted business database URL required}
      VINHOMES_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      VINHOMES_API_PASSWORD_AUTH: '1'
      VINHOMES_API_RESIDENT_SIGNING_KEY: ${RESIDENT_SIGNING_KEY:?32 byte hex key required}
      VINHOMES_API_RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      RECEPTION_DELEGATION_KEY: ${RECEPTION_DELEGATION_KEY:?delegation key required}
      VINHOMES_API_RECEPTION_URL: http://reception:4202
      VINHOMES_API_COORDINATION_SERVICE_TOKEN: ${COORDINATION_SERVICE_TOKEN:?Coordination token required}
      VINHOMES_API_COORDINATION_URL: http://coordination:4300
      VINHOMES_API_TECHNICAL_TOOLS_URL: http://technical-tools:8788/internal/technical/v1
      VINHOMES_API_TECHNICAL_TOOLS_TOKEN: ${TECHNICAL_TOOLS_SERVICE_TOKEN:?tool token required}
      # The tool gateway reaches the knowledge search service here for management's agents.
      VINHOMES_API_KNOWLEDGE_URL: http://knowledge:8787
      # Schedules of management's agents: the `routines` service keeps them and hands back what is due.
      VINHOMES_API_ROUTINES_URL: http://routines:8789/internal/routines/v1
      VINHOMES_API_ROUTINES_TOKEN: ${ROUTINES_SERVICE_TOKEN:?schedule token required}
      VINHOMES_API_REPAIR_CATEGORY_CODES: ${REPAIR_CATEGORY_CODES:-}
      # 1 once the web apps are only reached over https (the proxy): the session cookie is then never sent in clear.
      VINHOMES_API_SECURE_COOKIES: ${SECURE_COOKIES:-0}
      # Photos and files are stored in a private bucket: the bundled MinIO, or any S3 service named by
      # S3_ENDPOINT. Content always leaves through the API, which checks who is asking.
      VINHOMES_API_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      VINHOMES_API_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?object storage access key required}
      VINHOMES_API_S3_SECRET_KEY: ${S3_SECRET_KEY:?object storage secret key required}
      VINHOMES_API_S3_BUCKET: ${S3_BUCKET:-vinhomes-files}
      FACTORY_SERVICE_URL: http://factory:4010
      FACTORY_SERVICE_TOKEN: ${FACTORY_SERVICE_TOKEN:?Factory token required}
      # Two settings, one list: browser sign-in and writes check the first, the resident app's CORS the second.
      VINHOMES_API_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
      VINHOMES_API_RESIDENT_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${VINHOMES_API_PORT:-8000}:8000'
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)']
  minio:
    # The official minio/minio image is no longer published on Docker Hub; this one is. Another
    # S3 service works as well: name it in S3_ENDPOINT and this container is simply not used.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: ['server', '/data']
    # The image runs as an unprivileged user that cannot write a fresh named volume.
    user: '0:0'
    restart: unless-stopped
    environment:
      # The server's administrator account. The API never uses it: the `storage` job makes the API
      # a key of its own (S3_ACCESS_KEY) that reaches the files bucket and nothing else.
      MINIO_ROOT_USER: ${S3_ADMIN_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_SECRET_KEY:-}
    volumes:
      - minio-data:/data
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD-SHELL', 'mc alias set self http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ready self']
  reception:
    image: vinhomes-reception:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agent-reception/Dockerfile
    restart: unless-stopped
    environment:
      RECEPTION_BACKEND_URL: http://api:8000
      RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      RECEPTION_KNOWLEDGE_URL: http://knowledge:8787
      RECEPTION_MODEL: ${RECEPTION_MODEL:-gpt-5.4-mini}
      RECEPTION_AGENT: ${RECEPTION_AGENT:-graph}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      # Another vendor for this role: its provider name, its own key, and an address only for `custom`.
      RECEPTION_MODEL_PROVIDER: ${RECEPTION_MODEL_PROVIDER:-}
      RECEPTION_MODEL_API_KEY: ${RECEPTION_MODEL_API_KEY:-}
      RECEPTION_MODEL_BASE_URL: ${RECEPTION_MODEL_BASE_URL:-}
    volumes:
      - reception-state:/var/lib/reception
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4202/health", timeout=5)']
  agents-net:
    # The network namespace the Supervisor and the OpenBot share. The Supervisor sends the agent
    # token to the Bot only over HTTPS or loopback, so the two meet on loopback here and the Bot is
    # reachable by nobody else. This container does nothing and so does not restart on its own:
    # either of the two can restart alone and comes back into the same namespace.
    image: busybox:1.37
    command: ['sleep', 'infinity']
    init: true
    restart: unless-stopped
    networks:
      default:
        aliases: [coordination]
  coordination:
    image: vinhomes-coordination:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agent-coordination/Dockerfile.vinhomes
    restart: unless-stopped
    network_mode: service:agents-net
    environment:
      COORDINATION_BACKEND_URL: http://api:8000
      COORDINATION_SERVICE_TOKEN: ${COORDINATION_SERVICE_TOKEN:?Coordination token required}
      COORDINATION_DATABASE_URL: ${COORDINATION_DATABASE_URL:?dedicated checkpoint database required}
      COORDINATION_MODEL: ${COORDINATION_MODEL:-gpt-5.4-mini}
      COORDINATION_OPENBOT_URL: http://127.0.0.1:4200/ag-ui
      COORDINATION_OPENBOT_MODEL: ${SPECIALIST_MODEL:-gpt-5.5}
      COORDINATION_TOOLS_URL: http://api:8000/internal/coordination/v1/tools
      COORDINATION_TOOLS_TOKEN: ${COORDINATION_SERVICE_TOKEN:?Coordination token required}
      COORDINATION_TOKEN_LIMIT: ${COORDINATION_TOKEN_LIMIT:-400000}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?OpenBot token required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      COORDINATION_MODEL_PROVIDER: ${COORDINATION_MODEL_PROVIDER:-}
      COORDINATION_MODEL_API_KEY: ${COORDINATION_MODEL_API_KEY:-}
      COORDINATION_MODEL_BASE_URL: ${COORDINATION_MODEL_BASE_URL:-}
      COORDINATION_MODEL_ANSWERS_AS: ${COORDINATION_MODEL_ANSWERS_AS:-}
    depends_on:
      api:
        condition: service_healthy
      openbot:
        condition: service_healthy
      technical-tools:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4300/ready", timeout=5)']
  knowledge:
    image: vinhomes-knowledge:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/vinhomes/Dockerfile.tools
    restart: unless-stopped
    environment:
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: '8787'
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:?restricted knowledge database URL required}
      KNOWLEDGE_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      KNOWLEDGE_BASE_ID: ${KNOWLEDGE_BASE_ID:?published knowledge base required}
      RECEPTION_API_URL: http://api:8000
      KNOWLEDGE_INTERNAL_HTTP_HOST: api
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      # The embedding model's own key and address, when OPENAI_API_KEY is not the one that made the vectors.
      KNOWLEDGE_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:8787/health")).ok ? 0 : 1)']
  technical-tools:
    image: vinhomes-technical-tools:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/vinhomes/Dockerfile.tools
    command: ['bun', 'server/src/technical-api/serve.ts']
    restart: unless-stopped
    environment:
      TECHNICAL_TOOLS_HOST: 0.0.0.0
      TECHNICAL_TOOLS_PORT: '8788'
      TECHNICAL_API_DATABASE_URL: ${TECHNICAL_API_DATABASE_URL:?restricted tools database URL required}
      TECHNICAL_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      TECHNICAL_TOOLS_SERVICE_TOKEN: ${TECHNICAL_TOOLS_SERVICE_TOKEN:?tool token required}
      # Seals the tokens of the external MCP connections an administrator adds. Without it that
      # screen answers "not configured" and everything else works. Changing it loses every stored token.
      TECHNICAL_CONNECTIONS_KEY: ${CONNECTIONS_KEY:-}
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:8788/health")).ok ? 0 : 1)']
  routines:
    # Schedules of management's agents. Its own database role: the tool host's may not update or delete.
    image: vinhomes-technical-tools:${VINHOMES_IMAGE_TAG:-latest}
    command: ['bun', 'server/src/room-routines/serve.ts']
    restart: unless-stopped
    environment:
      ROUTINES_HOST: 0.0.0.0
      ROUTINES_PORT: '8789'
      ROUTINES_DATABASE_URL: ${ROUTINES_DATABASE_URL:?restricted schedule database URL required}
      ROUTINES_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      ROUTINES_SERVICE_TOKEN: ${ROUTINES_SERVICE_TOKEN:?schedule token required}
      ROUTINES_API_URL: http://api:8000
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:8789/health")).ok ? 0 : 1)']
  factory:
    image: vinhomes-factory:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../../agent-factory
    restart: unless-stopped
    environment:
      FACTORY_SERVICE_TOKEN: ${FACTORY_SERVICE_TOKEN:?Factory token required}
      FACTORY_MODEL_API_KEY: ${OPENAI_API_KEY:?model key required}
      FACTORY_MODEL: ${FACTORY_MODEL:-gpt-5.5}
      FACTORY_REASONING_EFFORT: ${FACTORY_REASONING_EFFORT:-low}
      FACTORY_CALL_TIMEOUT_MS: ${FACTORY_CALL_TIMEOUT_MS:-60000}
      FACTORY_MAX_COMPLETION_TOKENS: ${FACTORY_MAX_COMPLETION_TOKENS:-8192}
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:4010/health")).ok ? 0 : 1)']
  openbot:
    image: vinhomes-openbot:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: agent-bot/Dockerfile
    restart: unless-stopped
    environment:
      BOT_MODEL: ${SPECIALIST_MODEL:-gpt-5.5}
      # The specialists' own vendor: set the key and the address together, or neither for OpenAI.
      OPENAI_API_KEY: ${SPECIALIST_MODEL_API_KEY:-${OPENAI_API_KEY:?model key required}}
      OPENAI_BASE_URL: ${SPECIALIST_MODEL_BASE_URL:-}
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN:?OpenBot token required}
    network_mode: service:agents-net
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:4200/health")).ok ? 0 : 1)']
  operations:
    image: vinhomes-operations:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/vinhomes/Dockerfile.operations
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
      APP_PORT: '3020'
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${OPERATIONS_PORT:-3020}:3020'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'bun', '-e', 'process.exit((await fetch("http://127.0.0.1:3020/operations/login")).ok ? 0 : 1)']
  resident:
    image: vinhomes-resident:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/vinhomes/Dockerfile.resident
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${RESIDENT_PORT:-3011}:3011'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3011/']
  upgrade:
    # Run by hand before starting a new release:
    #   docker compose --env-file deployment.env --profile upgrade run --rm upgrade
    # It needs the database owner, which no running service is given.
    profiles: [upgrade]
    image: vinhomes-technical-tools:${VINHOMES_IMAGE_TAG:-latest}
    command: ['bun', 'server/scripts/vinhomes-upgrade.ts']
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VINHOMES_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      VINHOMES_API_DATABASE_URL: ${VINHOMES_API_DATABASE_URL:?restricted business database URL required}
      TECHNICAL_API_DATABASE_URL: ${TECHNICAL_API_DATABASE_URL:?restricted tools database URL required}
      ROUTINES_DATABASE_URL: ${ROUTINES_DATABASE_URL:?restricted schedule database URL required}
  catalogue:
    # Run by hand after `upgrade`: registers the tools the API's gateway serves, so agents can be granted them.
    #   docker compose --env-file deployment.env --profile upgrade run --rm catalogue
    profiles: [upgrade]
    image: vinhomes-api:${VINHOMES_IMAGE_TAG:-latest}
    command: ['python', '-m', 'vinhomes_api.tool_catalogue']
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VINHOMES_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
  audit-retention:
    # Removes audit rows older than AUDIT_RETENTION_DAYS; unset, it removes nothing. Run it from the
    # host's scheduler, once a day:
    #   docker compose --env-file deployment.env --profile upgrade run --rm audit-retention
    profiles: [upgrade]
    image: vinhomes-technical-tools:${VINHOMES_IMAGE_TAG:-latest}
    command: ['bun', 'server/scripts/vinhomes-audit-retention.ts']
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VINHOMES_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
  storage:
    # Run by hand once, and again after restoring a database: creates the bucket, records it as the
    # place files are stored, and moves the photos an earlier release kept in the api-files volume.
    #   docker compose --env-file deployment.env --profile upgrade run --rm storage
    profiles: [upgrade]
    image: vinhomes-api:${VINHOMES_IMAGE_TAG:-latest}
    command: ['python', '-m', 'vinhomes_api.storage_setup']
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      VINHOMES_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      VINHOMES_API_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      VINHOMES_API_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?object storage access key required}
      VINHOMES_API_S3_SECRET_KEY: ${S3_SECRET_KEY:?object storage secret key required}
      VINHOMES_API_S3_BUCKET: ${S3_BUCKET:-vinhomes-files}
      VINHOMES_API_S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:-}
      VINHOMES_API_S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:-}
    volumes:
      # Read only by this job: the photos of a release that stored them on disk.
      - api-files:/var/lib/vinhomes/files
    depends_on:
      - minio
  proxy:
    # TLS in front of the two web apps; see Caddyfile. Not started unless asked for:
    #   docker compose --env-file deployment.env --profile tls up -d
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    environment:
      OPERATIONS_DOMAIN: ${OPERATIONS_DOMAIN:-operations.localhost}
      RESIDENT_DOMAIN: ${RESIDENT_DOMAIN:-resident.localhost}
      PROXY_TLS: ${PROXY_TLS:-}
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - operations
      - resident

volumes:
  caddy-data:
  reception-state:
  api-files:
  minio-data:
