name: CI
on:
  pull_request:
  push:
    branches: [main, develop, dev_TeamChien, dev_teamChien_HuyDo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  types-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd agent-factory --frozen-lockfile
      - run: bun run typecheck
      - run: bun test server/tests/business-auth.test.ts server/tests/config.test.ts server/tests/guards.test.ts app/tests/serve.test.ts
      - name: Connected role interfaces
        # Each file owns and closes its Happy DOM window. React/portal modules retain the first
        # window they import, so a separate process gives every file its own module graph as well.
        run: |
          for test_file in \
            app/tests/connected-operations-ui.test.tsx app/tests/operations-field-work.test.tsx \
            app/tests/operations-admin.test.tsx app/tests/operations-coordination.test.tsx \
            app/tests/operations-agent-trial.test.tsx app/tests/operations-room-files.test.tsx \
            app/tests/operations-schedules.test.tsx app/tests/agent-factory-ui.test.tsx
          do
            bun --no-env-file test "$test_file"
          done
      - run: bun run test:resident
      - run: bun --no-env-file test
        working-directory: agent-factory
      # The tool host, the report tools, the security tools and the knowledge search behind the agents.
      - run: >-
          bun --no-env-file test server/tests/technical-api.routes.test.ts server/tests/technical-connections.routes.test.ts
          server/tests/technical-session.routes.test.ts server/tests/technical-tools server/tests/reporting
          server/tests/security-tools server/tests/knowledge
  # Reception and the Supervisor: what a resident's message becomes before any person reads it.
  # Two jobs: the two services pin different versions of the same libraries.
  reception:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-reception
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests -q --ignore=tests/evals
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-coordination
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
  business-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESIDENT_TEST_ADMIN_URL: postgresql://postgres:ci-password@localhost:5432/postgres
      RESIDENT_TEST_RUNTIME_URL: postgresql+asyncpg://vinhomes_v3_api:ci-runtime@localhost:5432/postgres
      VINHOMES_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      VINHOMES_TEST_S3_ACCESS_KEY: ci-minio-admin
      VINHOMES_TEST_S3_SECRET_KEY: ci-minio-secret-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -e 'services/vinhomes-api[test]'
      - name: Restricted runtime role and real object storage
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def setup():
              database = await asyncpg.connect(os.environ['RESIDENT_TEST_ADMIN_URL'])
              try:
                  await database.execute("CREATE ROLE vinhomes_v3_api LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-runtime'")
              finally:
                  await database.close()
          asyncio.run(setup())
          PY
          docker run -d --name ci-minio --user 0 -p 9000:9000 -e MINIO_ROOT_USER=ci-minio-admin -e MINIO_ROOT_PASSWORD=ci-minio-secret-password cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live
      - run: python -m pytest services/vinhomes-api/tests -q
