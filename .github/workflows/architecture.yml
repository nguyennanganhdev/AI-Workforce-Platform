name: Workforce integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openbot_test
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
      TEST_DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: agent-bot
      - run: bun install --frozen-lockfile
        working-directory: agent-langgraph
      - run: bun install
        working-directory: agent-mastra
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bunx drizzle-kit migrate --config=drizzle.config.ts
        working-directory: server
      - run: bun run test:ci
  # Meta-Agent P0 release gate: the 20-case golden set against the configured construction model.
  # The recorded-completion replay already runs in `tests` through test:ci on every push. This job
  # calls the real provider, so it runs for release tags and manual dispatch only. A missing key,
  # an incomplete run, unknown token usage, unapproved thresholds or a breached gate fails it; it is
  # never skipped. Making it a required status for releases is a repository setting, not this file.
  factory-quality:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.FACTORY_QUALITY_OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.FACTORY_QUALITY_ANTHROPIC_API_KEY }}
      BOT_PROVIDER: ${{ vars.BOT_PROVIDER }}
      BOT_MODEL: ${{ vars.BOT_MODEL }}
      FACTORY_QUALITY_THRESHOLD_APPROVAL: ${{ vars.FACTORY_QUALITY_THRESHOLD_APPROVAL }}
      FACTORY_QUALITY_REPORT: factory-quality-report.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run eval:factory-quality
      # The report carries metrics, fingerprints and evaluated responses; never keys or headers.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-quality-report
          path: factory-quality-report.json
          if-no-files-found: error
