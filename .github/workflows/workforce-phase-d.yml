name: Workforce Phase D Gate

on:
  pull_request:
    paths:
      - "platform_VP/agentscope/src/agentscope/app/**"
      - "platform_VP/agentscope/src/agentscope/app/storage/_sql/_alembic/**"
      - "platform_VP/agentscope/tests/**"
      - "platform_VP/agentscope/scripts/workforce/**"
      - "platform_VP/agentscope/deploy/workforce/**"
      - "platform_VP/agentscope/examples/web_ui/frontend/**"
      - "platform_VP/agentscope/examples/web_ui/pnpm-lock.yaml"
      - ".github/workflows/workforce-phase-d.yml"
  push:
    branches: [develop2]

jobs:
  phase-d:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform_VP/agentscope
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentscope_test
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentscope -d agentscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTSCOPE_SQL_URL: >-
        postgresql+asyncpg://agentscope:agentscope_test@localhost:5432/agentscope_test
      WORKFORCE_TEST_POSTGRES_URL: >-
        postgresql+asyncpg://agentscope:agentscope_test@localhost:5432/agentscope_test
      WORKFORCE_E2E_FACTORY: >-
        tests.workforce.fixtures.release_candidate_factory:factory
      PYTEST_ADDOPTS: "--asyncio-mode=auto"
      PYTHONPATH: "${{ github.workspace }}/platform_VP/agentscope:${{ github.workspace }}/platform_VP/agentscope/tests:${{ github.workspace }}/platform_VP/agentscope/tests/workforce/console"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "platform_VP/agentscope/examples/web_ui/pnpm-lock.yaml"
      - name: Install Workforce test dependencies
        run: uv pip install -q -e ".[dev,service,storage-postgres,auth]" playwright pytest-asyncio
      - name: Install frontend and browser dependencies
        run: |
          pnpm --dir examples/web_ui install --frozen-lockfile --ignore-scripts
          python -m playwright install --with-deps chromium
      - name: Validate environment and migration head
        run: python scripts/workforce/check_phase_d_environment.py
      - name: Upgrade the production migration chain
        run: python -m alembic -c src/agentscope/app/storage/_sql/_alembic/alembic.ini upgrade head
      - name: Rehearse PostgreSQL backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" dropdb --if-exists -U agentscope agentscope_restore_test
          docker exec "$POSTGRES_CONTAINER" createdb -U agentscope agentscope_restore_test
          docker exec "$POSTGRES_CONTAINER" pg_dump -U agentscope --format=custom --file=/tmp/workforce-phase-d.dump agentscope_test
          docker exec "$POSTGRES_CONTAINER" pg_restore -U agentscope --exit-on-error --no-owner --no-privileges --dbname=agentscope_restore_test /tmp/workforce-phase-d.dump
          EXPECTED_HEAD="$(python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; print(ScriptDirectory.from_config(Config("src/agentscope/app/storage/_sql/_alembic/alembic.ini")).get_current_head())')"
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U agentscope -d agentscope_restore_test -Atc 'select version_num from alembic_version')" = "$EXPECTED_HEAD"
      - name: Build and lint the manager frontend
        run: |
          pnpm --dir examples/web_ui/frontend lint
          pnpm --dir examples/web_ui/frontend build
      - name: Start Builder browser fixture
        env:
          VITE_VIN_EXPERIENCE_ENABLED: "true"
        run: |
          pnpm --dir examples/web_ui/frontend exec vite --host 127.0.0.1 --port 5183 > /tmp/workforce-builder-vite.log 2>&1 &
          echo $! > /tmp/workforce-builder-vite.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5183/src/features/workforce/builder/tests/demo.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/workforce-builder-vite.log
          exit 1
      - name: Prepare D7 evidence directory
        run: mkdir -p .artifacts/phase-d
      - name: Run Foundation gates
        continue-on-error: true
        run: python -m pytest tests/workforce/foundation --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/foundation.xml
      - name: Run Registry gates
        continue-on-error: true
        run: python -m pytest tests/workforce/registry --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/registry.xml
      - name: Run Builder gates including browser regressions
        continue-on-error: true
        env:
          BUILDER_UI_TEST_URL: http://127.0.0.1:5183/src/features/workforce/builder/tests/demo.html
        run: python -m pytest tests/workforce/builder --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/builder.xml
      - name: Run Lifecycle gates
        continue-on-error: true
        run: python -m pytest tests/workforce/lifecycle --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/lifecycle.xml
      - name: Run Orchestration gates
        continue-on-error: true
        run: python -m pytest tests/workforce/orchestration --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/orchestration.xml
      - name: Run Execution gates
        continue-on-error: true
        run: python -m pytest tests/workforce/execution --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/execution.xml
      - name: Run composition and migration gates
        continue-on-error: true
        run: python -m pytest tests/workforce/integrations --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/integrations.xml
      - name: Run D5 full-platform and fault E2E
        continue-on-error: true
        run: python -m pytest tests/workforce/e2e --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/e2e.xml
      - name: Run console and evaluation tooling gates
        continue-on-error: true
        env:
          VIN_UI_TEST_URL: http://127.0.0.1:5183
        run: python -m pytest tests/workforce/console tests/workforce/eval --import-mode=importlib -q -rs --junitxml=.artifacts/phase-d/console.xml
      - name: Run team collaboration and shared-context gates
        continue-on-error: true
        run: >-
          python -m pytest
          tests/team_collaboration_test.py
          tests/team_member_middleware_test.py
          tests/team_say_shared_context_test.py
          tests/team_shared_context_test.py
          tests/shared_context_budget_recovery_test.py
          tests/dong_merge_compatibility_test.py
          tests/leader_evidence_middleware_test.py
          tests/service_chat_run_context_test.py
          tests/session_runtime_regression_test.py
          tests/session_audience_boundary_test.py
          tests/evidence_claims_test.py
          tests/leader_runtime_gaps_test.py
          tests/room_realtime_test.py
          tests/service_model_test.py
          tests/workforce_provider_usage_test.py
          tests/workforce_model_routing_test.py
          tests/workforce_task_ledger_test.py
          tests/workforce_agent_memory_test.py
          tests/workforce_consent_test.py
          tests/workforce_knowledge_store_test.py
          tests/workforce_leader_wait_test.py
          tests/mcp_runtime_headers_test.py
          tests/service_team_tools_test.py
          -q -rs --junitxml=.artifacts/phase-d/collaboration.xml
      - name: Build D7 release-candidate report
        if: always()
        env:
          SANDBOX_EVIDENCE: ${{ vars.WORKFORCE_SANDBOX_EVIDENCE }}
        run: |
          python scripts/workforce/write_phase_d_report.py \
            --junit-dir .artifacts/phase-d \
            --output .artifacts/phase-d/PHASE_D_RELEASE_CANDIDATE.md \
            --commit "$GITHUB_SHA" \
            --sandbox-evidence "$SANDBOX_EVIDENCE" \
            --require foundation.xml \
            --require registry.xml \
            --require builder.xml \
            --require lifecycle.xml \
            --require orchestration.xml \
            --require execution.xml \
            --require integrations.xml \
            --require e2e.xml             --require console.xml             --require collaboration.xml
      - name: Upload D7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-phase-d-${{ github.sha }}
          path: platform_VP/agentscope/.artifacts/phase-d
          if-no-files-found: error
