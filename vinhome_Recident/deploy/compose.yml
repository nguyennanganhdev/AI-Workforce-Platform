name: vinhomes-domain

# The Vinhomes domain: business API, Reception agent and the three web fronts.
#
# Object storage (any S3 service) and the database are not started here. The database must already hold
# the domain schema: this package has no migration job yet.

x-python-health: &python-health
  interval: 15s
  timeout: 8s
  retries: 5
  start_period: 30s

services:
  # Builds the schema in an empty database and brings an older one up to date, then stops. Runs as the
  # database owner (MIGRATION_DATABASE_URL); the API itself never gets that role.
  migrate:
    image: vinhomes-domain-api:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../services/vinhomes-api
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?database owner URL required to create the schema}
    command: ['python', '-m', 'vinhomes_api.database', 'migrate']

  api:
    image: vinhomes-domain-api:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../services/vinhomes-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      VINHOMES_API_DATABASE_URL: ${VINHOMES_API_DATABASE_URL:?restricted business database URL required}
      VINHOMES_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      VINHOMES_API_PASSWORD_AUTH: '1'
      VINHOMES_API_RESIDENT_SIGNING_KEY: ${RESIDENT_SIGNING_KEY:?32 byte hex key required}
      # Reception reaches this API with the service token and a short-lived delegation signed with the key.
      VINHOMES_API_RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      RECEPTION_DELEGATION_KEY: ${RECEPTION_DELEGATION_KEY:?delegation key required}
      VINHOMES_API_RECEPTION_URL: http://reception:4202
      VINHOMES_API_REPAIR_CATEGORY_CODES: ${REPAIR_CATEGORY_CODES:-}
      # 1 once the web apps are only reached over https (the proxy): the session cookie is then never sent in clear.
      VINHOMES_API_SECURE_COOKIES: ${SECURE_COOKIES:-0}
      # Photos and files are stored in a private bucket on any S3 service. Content always leaves through
      # the API, which checks who is asking.
      VINHOMES_API_S3_ENDPOINT: ${S3_ENDPOINT:?object storage endpoint required}
      VINHOMES_API_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?object storage access key required}
      VINHOMES_API_S3_SECRET_KEY: ${S3_SECRET_KEY:?object storage secret key required}
      VINHOMES_API_S3_BUCKET: ${S3_BUCKET:-vinhomes-files}
      VINHOMES_API_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      VINHOMES_API_S3_REGION: ${S3_REGION:-us-east-1}
      # Two settings, one list: browser sign-in and writes check the first, the resident app's CORS the second.
      VINHOMES_API_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
      VINHOMES_API_RESIDENT_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
    volumes:
      - api-files:/var/lib/vinhomes/files
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${VINHOMES_API_PORT:-8000}:8000'
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)']

  reception:
    image: vinhomes-domain-reception:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../agents/reception
    restart: unless-stopped
    environment:
      RECEPTION_BACKEND_URL: http://api:8000
      RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      # Where the knowledge pack is searched. Empty: Reception answers no information question from a source.
      RECEPTION_KNOWLEDGE_URL: ${RECEPTION_KNOWLEDGE_URL:-}
      RECEPTION_MODEL: ${RECEPTION_MODEL:-gpt-5.4-mini}
      RECEPTION_AGENT: ${RECEPTION_AGENT:-loop}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      # Another vendor for this role: its provider name, its own key, and an address only for `custom`.
      RECEPTION_MODEL_PROVIDER: ${RECEPTION_MODEL_PROVIDER:-}
      RECEPTION_MODEL_API_KEY: ${RECEPTION_MODEL_API_KEY:-}
      RECEPTION_MODEL_BASE_URL: ${RECEPTION_MODEL_BASE_URL:-}
    volumes:
      - reception-state:/var/lib/reception
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4202/health", timeout=5)']

  # Residents.
  resident:
    image: vinhomes-domain-resident:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: resident-web
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${RESIDENT_PORT:-3011}:3011'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3011/']

  # Management and administrators. The same image as `field`, told apart by VINHOMES_SURFACE.
  operations:
    image: vinhomes-domain-operations:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: staff-web
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
      VINHOMES_SURFACE: operations
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${OPERATIONS_PORT:-3020}:3020'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3020/operations/login']

  # Staff on site: only the work pages, in a separate sign-in.
  field:
    image: vinhomes-domain-operations:${VINHOMES_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
      VINHOMES_SURFACE: field
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${FIELD_PORT:-3023}:3020'
    depends_on:
      api:
        condition: service_healthy
      operations:
        condition: service_started
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3020/operations/login']

volumes:
  api-files:
  reception-state:
