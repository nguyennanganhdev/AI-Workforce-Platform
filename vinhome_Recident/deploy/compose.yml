name: vinhomes-domain

# The Vinhomes domain: business API, Reception agent and the three web fronts.
#
# The services the API calls (Supervisor, knowledge search, technical tool host, schedules, agent
# factory, object storage) belong to the platform and are NOT started here. Name them with the *_URL
# variables in deployment.env, or attach this project to the network where they run. The database
# must already be migrated: this package has no migration job.

x-python-health: &python-health
  interval: 15s
  timeout: 8s
  retries: 5
  start_period: 30s

services:
  api:
    image: vinhomes-domain-api:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../services/vinhomes-api
    restart: unless-stopped
    environment:
      VINHOMES_API_DATABASE_URL: ${VINHOMES_API_DATABASE_URL:?restricted business database URL required}
      VINHOMES_API_TENANT_ID: ${VINHOMES_TENANT_ID:?tenant required}
      VINHOMES_API_PASSWORD_AUTH: '1'
      VINHOMES_API_RESIDENT_SIGNING_KEY: ${RESIDENT_SIGNING_KEY:?32 byte hex key required}
      VINHOMES_API_RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      RECEPTION_DELEGATION_KEY: ${RECEPTION_DELEGATION_KEY:?delegation key required}
      VINHOMES_API_RECEPTION_URL: http://reception:4202
      VINHOMES_API_COORDINATION_SERVICE_TOKEN: ${COORDINATION_SERVICE_TOKEN:?Coordination token required}
      VINHOMES_API_COORDINATION_URL: ${COORDINATION_URL:-http://coordination:4300}
      VINHOMES_API_TECHNICAL_TOOLS_URL: ${TECHNICAL_TOOLS_URL:-http://technical-tools:8788/internal/technical/v1}
      VINHOMES_API_TECHNICAL_TOOLS_TOKEN: ${TECHNICAL_TOOLS_SERVICE_TOKEN:?tool token required}
      # 0 when the specialists' model reads no images: a photo on a question is then only named to the agent.
      VINHOMES_API_SPECIALIST_SEES_IMAGES: ${SPECIALIST_SEES_IMAGES:-1}
      # The tool gateway reaches the knowledge search service here for management's agents.
      VINHOMES_API_KNOWLEDGE_URL: ${KNOWLEDGE_URL:-http://knowledge:8787}
      # Schedules of management's agents: the `routines` service keeps them and hands back what is due.
      VINHOMES_API_ROUTINES_URL: ${ROUTINES_URL:-http://routines:8789/internal/routines/v1}
      VINHOMES_API_ROUTINES_TOKEN: ${ROUTINES_SERVICE_TOKEN:?schedule token required}
      VINHOMES_API_REPAIR_CATEGORY_CODES: ${REPAIR_CATEGORY_CODES:-}
      # 1: the Supervisor approves its own plan and hands the work to an available technician; management
      # only closes the session. 0: management approves each plan and assigns the technician.
      VINHOMES_API_SUPERVISOR_APPROVES_PLANS: ${SUPERVISOR_APPROVES_PLANS:-1}
      # 1 once the web apps are only reached over https (the proxy): the session cookie is then never sent in clear.
      VINHOMES_API_SECURE_COOKIES: ${SECURE_COOKIES:-0}
      # Agent evaluation (docs/teams/dong/eval_agent.md). The evaluator service of profile `eval` generates cases and
      # plays runs; EVAL_SANDBOX_TOKEN is set only in the sandbox stack's own env file (a database of its own).
      VINHOMES_API_EVALUATOR_URL: ${EVALUATOR_URL:-http://evaluator:4400}
      VINHOMES_API_EVAL_SERVICE_TOKEN: ${EVAL_SERVICE_TOKEN:-}
      VINHOMES_API_EVAL_SANDBOX_TOKEN: ${EVAL_SANDBOX_TOKEN:-}
      VINHOMES_API_EVAL_METRIC_PROFILE: ${EVAL_METRIC_PROFILE:-none}
      # Seals the model API keys that the administrator or a management unit types in the app.
      # Without it only keys named by environment variables can be used.
      VINHOMES_API_MODEL_CREDENTIALS_KEY: ${MODEL_CREDENTIALS_KEY:-}
      # Photos and files are stored in a private bucket: the bundled MinIO, or any S3 service named by
      # S3_ENDPOINT. Content always leaves through the API, which checks who is asking.
      VINHOMES_API_S3_ENDPOINT: ${S3_ENDPOINT:?object storage endpoint required}
      VINHOMES_API_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?object storage access key required}
      VINHOMES_API_S3_SECRET_KEY: ${S3_SECRET_KEY:?object storage secret key required}
      VINHOMES_API_S3_BUCKET: ${S3_BUCKET:-vinhomes-files}
      VINHOMES_API_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      VINHOMES_API_S3_REGION: ${S3_REGION:-us-east-1}
      FACTORY_SERVICE_URL: ${FACTORY_URL:-http://factory:4010}
      FACTORY_SERVICE_TOKEN: ${FACTORY_SERVICE_TOKEN:-}
      # Registry rows reference deployment-owned variables; provider secrets never reach the browser.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      COORDINATION_MODEL: ${COORDINATION_MODEL:-gpt-5.4-mini}
      RECEPTION_MODEL_API_KEY: ${RECEPTION_MODEL_API_KEY:-}
      RECEPTION_MODEL_BASE_URL: ${RECEPTION_MODEL_BASE_URL:-}
      COORDINATION_MODEL_API_KEY: ${COORDINATION_MODEL_API_KEY:-}
      COORDINATION_MODEL_BASE_URL: ${COORDINATION_MODEL_BASE_URL:-}
      SPECIALIST_MODEL_API_KEY: ${SPECIALIST_MODEL_API_KEY:-}
      SPECIALIST_MODEL_BASE_URL: ${SPECIALIST_MODEL_BASE_URL:-}
      FACTORY_MODEL_API_KEY: ${FACTORY_MODEL_API_KEY:-${OPENAI_API_KEY}}
      FACTORY_MODEL_BASE_URL: ${FACTORY_MODEL_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # Two settings, one list: browser sign-in and writes check the first, the resident app's CORS the second.
      VINHOMES_API_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
      VINHOMES_API_RESIDENT_ALLOWED_ORIGINS: ${VINHOMES_ALLOWED_ORIGINS:-http://localhost:3020,http://localhost:3011}
    volumes:
      - api-files:/var/lib/vinhomes/files
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${VINHOMES_API_PORT:-8000}:8000'
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)']
  reception:
    image: vinhomes-domain-reception:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ../agents/reception
    restart: unless-stopped
    environment:
      RECEPTION_BACKEND_URL: http://api:8000
      RECEPTION_SERVICE_TOKEN: ${RECEPTION_SERVICE_TOKEN:?Reception token required}
      RECEPTION_KNOWLEDGE_URL: ${KNOWLEDGE_URL:-http://knowledge:8787}
      RECEPTION_MODEL: ${RECEPTION_MODEL:-gpt-5.4-mini}
      RECEPTION_AGENT: ${RECEPTION_AGENT:-loop}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?model key required}
      # Another vendor for this role: its provider name, its own key, and an address only for `custom`.
      RECEPTION_MODEL_PROVIDER: ${RECEPTION_MODEL_PROVIDER:-}
      RECEPTION_MODEL_API_KEY: ${RECEPTION_MODEL_API_KEY:-}
      RECEPTION_MODEL_BASE_URL: ${RECEPTION_MODEL_BASE_URL:-}
    volumes:
      - reception-state:/var/lib/reception
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *python-health
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4202/health", timeout=5)']

  # Residents.
  resident:
    image: vinhomes-domain-resident:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: resident-web
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${RESIDENT_PORT:-3011}:3011'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3011/']

  # Management and administrators. The same image as `field`, told apart by VINHOMES_SURFACE.
  operations:
    image: vinhomes-domain-operations:${VINHOMES_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: staff-web
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform:3001}
      VINHOMES_SURFACE: operations
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${OPERATIONS_PORT:-3020}:3020'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3020/operations/login']

  # Staff on site: only the work pages, in a separate sign-in.
  field:
    image: vinhomes-domain-operations:${VINHOMES_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      VINHOMES_API_URL: http://api:8000
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform:3001}
      VINHOMES_SURFACE: field
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${FIELD_PORT:-3023}:3020'
    depends_on:
      api:
        condition: service_healthy
      operations:
        condition: service_started
    healthcheck:
      interval: 15s
      timeout: 8s
      retries: 5
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3020/operations/login']

volumes:
  api-files:
  reception-state:
