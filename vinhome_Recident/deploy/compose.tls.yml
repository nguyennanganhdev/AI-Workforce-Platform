# Enable only after certificate issuance and configure-tls.py succeeded.
services:
  gateway:
    volumes:
      - ./nginx/gateway.tls.generated.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${ACME_WEBROOT:-/srv/vinhomes-acme}:/var/www/acme:ro
      - ${TLS_CERT_DIR:-/srv/vinhomes-tls}:/etc/letsencrypt:ro
    ports:
      - '${VINHOMES_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:8443'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
