[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-coordination"
version = "0.1.0"
description = "Vinhomes AI Workforce - Agent Coordination Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "agentscope>=0.0.1", # Giữ placeholder cho AgentScope
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor", "src/groupchat", "src/adapters", "src/persistence", "src/agents"]
