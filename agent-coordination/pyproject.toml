[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsf-agent-coordination"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "jsonschema==4.25.1", "agentscope==2.0.9", "httpx==0.28.1", "uvicorn==0.54.0", "starlette==1.7.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
