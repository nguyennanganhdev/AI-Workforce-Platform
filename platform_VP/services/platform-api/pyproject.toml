[project]
name = "vp-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "redis>=5,<7",
  "cryptography>=44",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "qdrant-client>=1.13,<1.15",
  "python-multipart>=0.0.20",
  "pypdf>=5,<7",
  "croniter>=6,<7",
  "agentscope[model-gemini,model-ollama,classifier-jev]",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "asgi-lifespan>=2,<3"]

[tool.uv.sources]
agentscope = { path = "../../agentscope", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"] # FastAPI dependency defaults are intentional.

[tool.ruff.lint.per-file-ignores]
"vp/queue.py" = ["BLE001"] # Worker boundary converts untrusted provider errors to safe codes.
"vp/integrations.py" = ["BLE001"] # External MCP boundary preserves uncertain execution state.
"vp/signals.py" = ["BLE001", "S110"] # Redis hints are optional; the durable DB queue still polls.
"vp/runtime.py" = ["BLE001"] # Provider errors never escape into user-visible events.
"tests/browser_server.py" = ["E402"] # Test-only environment must be set before importing the app.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vp"]
