# Same-host partner: the platform app joins the partner's Docker network.
#
#   docker compose -f compose.yaml -f compose.partner-network.yaml up -d
#
# The partner's containers then reach the platform at http://awp-platform:8000
# (PARTNER_PLATFORM_ALIAS)
# and the platform reaches the partner's services by their service names
# (e.g. Vinhomes' MCP at http://api:8000/mcp), without exposing either side.
services:
  app:
    networks:
      default: {}
      partner:
        aliases: ["${PARTNER_PLATFORM_ALIAS:-awp-platform}"]

networks:
  partner:
    external: true
    name: ${PARTNER_DOCKER_NETWORK:?set PARTNER_DOCKER_NETWORK, e.g. vinhomes-domain_default}
