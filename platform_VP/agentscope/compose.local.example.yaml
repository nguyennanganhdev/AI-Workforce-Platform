# Example of a per-developer override. Copy to compose.override.yaml (which
# docker compose loads automatically and git ignores) and edit the images to
# ones that exist on your machine.
services:
  app:
    image: agentscope-ollama-local:latest
  minio:
    image: agentscope-minio-local:2025-10-15
  minio-init:
    image: agentscope-minio-local:2025-10-15
