map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 100m;

    # Docker's DNS, re-asked every 10 s: a literal upstream is resolved once
    # at start, so a recreated app container (new IP) would get 502s until
    # this container restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API, including SSE, uploads and the rotating refresh cookie.
    location /api/ {
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # The API scopes its refresh cookie to /auth; the browser sees it under /api/auth.
        proxy_cookie_path /auth /api/auth;
        add_header X-Accel-Buffering no always;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (landing at "/", /login, /chat, ...) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
