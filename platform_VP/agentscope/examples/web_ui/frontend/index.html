<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/vagents-favicon-32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/vagents-favicon-64.png" />
		<link rel="apple-touch-icon" href="/vagents-app-icon-512.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Tạo đội ngũ AI chuyên trách, kết nối công cụ và vận hành quy trình doanh nghiệp cùng VAgents."
		/>
		<title>VAgents | Đội ngũ AI cho mọi quy trình</title>
		<script>
			// Applied before the first paint, so the theme never flashes.
			const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
			const applyTheme = () =>
				document.documentElement.classList.toggle('dark', darkQuery.matches);
			applyTheme();
			darkQuery.addEventListener('change', applyTheme);
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
