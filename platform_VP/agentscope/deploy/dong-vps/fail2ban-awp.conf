# Installed as /etc/fail2ban/jail.d/awp.local
# Bans in fail2ban's own nftables table, so Docker's rules are left alone.
[DEFAULT]
banaction = nftables-multiport
banaction_allports = nftables-allports
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
findtime = 10m
maxretry = 5
bantime = 24h
bantime.increment = true
bantime.maxtime = 30d

[sshd]
enabled = true
backend = auto
logpath = /var/log/auth.log
