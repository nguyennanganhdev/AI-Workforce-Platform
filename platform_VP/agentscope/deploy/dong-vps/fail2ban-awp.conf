# Installed as /etc/fail2ban/jail.d/awp.local
# Bans in fail2ban's own nftables table, so Docker's rules are left alone.
[DEFAULT]
banaction = nftables-multiport
banaction_allports = nftables-allports
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
findtime = 10m
maxretry = 5
bantime = 24h
bantime.increment = true
bantime.maxtime = 30d

[sshd]
enabled = true
backend = auto
logpath = /var/log/auth.log

# Web jails read the gateway's access log. Docker forwards the published
# ports, so these bans sit on the forward hook instead of input.
[awp-gw-probe]
# Scanner probes the gateway closed with 444 (.env, .git, *.php, wp-*, ...).
enabled = true
backend = auto
filter = awp-gw-probe
logpath = /var/log/awp-gateway/access.log
maxretry = 3
action = nftables-allports[name=awp-gw-probe, chain=f2b-web, chain_hook=forward]

[awp-gw-flood]
# Clients that keep hitting the rate limit; real peaks stay far below it.
enabled = true
backend = auto
filter = awp-gw-flood
logpath = /var/log/awp-gateway/access.log
maxretry = 50
findtime = 5m
bantime = 1h
action = nftables-allports[name=awp-gw-flood, chain=f2b-web, chain_hook=forward]
