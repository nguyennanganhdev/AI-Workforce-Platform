# TLS front door for Dong's platform.
#   https://vinhome-platform.duckdns.org       -> web (SPA; its nginx proxies /api to the app)
#   https://vinhome-platform.duckdns.org/agentscope/ -> MinIO presigned objects (S3_PUBLIC_ENDPOINT)
#   https://vinhome-platform.duckdns.org:8443  -> app API at its root (kept for direct API clients)
# Certificate: certbot DNS-01 on the host, /srv/vinhomes-tls.

resolver 127.0.0.11 valid=10s ipv6=off;

# --- Request guard -----------------------------------------------------------
# Per client IP. The host and the Docker network are never limited.
server_tokens off;
client_header_timeout 10s;
client_body_timeout 30s;
limit_req_status 429;
limit_conn_status 429;

geo $gw_limited {
  default 1;
  127.0.0.1 0;
  172.16.0.0/12 0;
}
map $gw_limited $gw_client {
  0 "";
  1 $binary_remote_addr;
}
# The team panel polls each member's history every 1.5 s, so a busy tab sends
# several API requests a second; this only stops floods.
limit_req_zone $gw_client zone=gw_api:10m rate=30r/s;
# Sign-in and sign-up only: slows down password guessing.
limit_req_zone $gw_client zone=gw_auth:10m rate=10r/m;
limit_conn_zone $gw_client zone=gw_conn:10m;

# Scanner probes for secrets and other stacks never reach the app; 444 closes
# the connection without a response. The first matching regex wins, so user
# files served from MinIO (any name, e.g. "report.php") are never blocked.
map $uri $gw_probe {
  default 0;
  ~^/agentscope/ 0;
  ~*/\.(env|git|svn|hg|aws|ssh|docker|htaccess|htpasswd|ds_store) 1;
  ~*\.(php|asp|aspx|jsp|cgi)$ 1;
  ~*^/(wp-|cgi-bin/|phpmyadmin) 1;
}
# -----------------------------------------------------------------------------

server {
  listen 8080;
  server_name _;
  location = /healthz { return 200 "ok\n"; }
  location / { return 308 https://vinhome-platform.duckdns.org$request_uri; }
}

server {
  listen 8443 ssl;
  server_name vinhome-platform.duckdns.org;
  ssl_certificate /etc/letsencrypt/live/vinhome-platform.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vinhome-platform.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  client_max_body_size 100m;
  limit_conn gw_conn 60;
  if ($gw_probe) { return 444; }

  # Presigned object URLs are signed for this host; MinIO checks the Host header.
  location ^~ /agentscope/ {
    set $gw_minio http://minio:9000;
    proxy_pass $gw_minio;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=gw_auth burst=10 nodelay;
    set $gw_web http://web:80;
    proxy_pass $gw_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    limit_req zone=gw_api burst=100 nodelay;
    set $gw_web http://web:80;
    proxy_pass $gw_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
  }
}

server {
  listen 8444 ssl;
  server_name vinhome-platform.duckdns.org;
  ssl_certificate /etc/letsencrypt/live/vinhome-platform.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vinhome-platform.duckdns.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  client_max_body_size 100m;
  limit_conn gw_conn 60;
  if ($gw_probe) { return 444; }

  location ~ ^/auth/(login|register)$ {
    limit_req zone=gw_auth burst=10 nodelay;
    set $gw_app http://app:8000;
    proxy_pass $gw_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }

  location / {
    limit_req zone=gw_api burst=100 nodelay;
    set $gw_app http://app:8000;
    proxy_pass $gw_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    # Chat replies stream over SSE and can wait on long model calls.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
