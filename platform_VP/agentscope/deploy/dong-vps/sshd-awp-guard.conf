# Installed as /etc/ssh/sshd_config.d/00-awp-guard.conf
# sshd keeps the first value it reads, so this file wins over 50-cloud-init.conf
# and the main sshd_config.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# Two team addresses still sign in with the root password (seen in auth.log
# 13-20/10). Remove this block once they use a key.
Match Address 36.50.135.148,171.225.203.144
    PasswordAuthentication yes
    PermitRootLogin yes
