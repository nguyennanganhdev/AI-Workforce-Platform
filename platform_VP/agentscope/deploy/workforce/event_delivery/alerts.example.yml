groups:
  - name: workforce-phase-d
    rules:
      - alert: WorkforceWorkerRestartBurst
        expr: increase(workforce_worker_restarts_total[10m]) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Workforce durable worker repeatedly restarts
          runbook: deploy/workforce/event_delivery/RUNBOOK.md#worker-restart

      - alert: WorkforceDurableJobFailure
        expr: increase(workforce_worker_iterations_total{outcome=~"failed|retry_scheduled|lease_lost"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Workforce durable jobs are failing or losing leases
          runbook: deploy/workforce/event_delivery/RUNBOOK.md#durable-job-backlog

      - alert: WorkforceProviderEventQuarantine
        expr: increase(workforce_provider_events_total{outcome="quarantined"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Provider events were quarantined
          runbook: deploy/workforce/event_delivery/RUNBOOK.md#provider-event-quarantine

      - alert: WorkforceNoWorkerProgress
        expr: sum(increase(workforce_worker_iterations_total[15m])) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No Workforce worker iteration was observed
          runbook: deploy/workforce/event_delivery/RUNBOOK.md#worker-restart
