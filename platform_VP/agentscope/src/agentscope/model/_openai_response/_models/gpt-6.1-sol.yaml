name: gpt-6.1-sol
label: GPT-6.1 Sol
status: active

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1050000
output_size: 128000

parameter_overrides:
  max_tokens:
    maximum: 128000
  thinking_enable:
    hidden: true
  reasoning_effort:
    default: medium
    enum:
      - low
      - medium
      - high
      - xhigh
      - max
  temperature:
    hidden: true
