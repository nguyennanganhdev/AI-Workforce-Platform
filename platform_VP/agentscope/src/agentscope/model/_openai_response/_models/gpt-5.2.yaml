name: gpt-5.2
label: GPT-5.2
status: active

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 400000
output_size: 128000

parameter_overrides:
  max_tokens:
    maximum: 128000
  thinking_enable:
    hidden: true
  reasoning_effort:
    default: none
    enum:
      - none
      - low
      - medium
      - high
      - xhigh
