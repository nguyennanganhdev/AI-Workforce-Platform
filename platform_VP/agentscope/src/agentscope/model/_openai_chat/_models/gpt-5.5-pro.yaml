name: gpt-5.5-pro
label: GPT-5.5 Pro
status: active

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1050000
output_size: 128000

parameter_overrides:
  max_tokens:
    maximum: 128000
  thinking_enable:
    hidden: true
  reasoning_effort:
    default: high
    enum:
      - medium
      - high
      - xhigh
  temperature:
    hidden: true
  top_p:
    hidden: true
  parallel_tool_calls:
    hidden: true
  voice:
    hidden: true
