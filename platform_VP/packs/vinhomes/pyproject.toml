[project]
name = "awp-vinhomes"
version = "0.1.0"
description = "Vinhomes domain pack for the AI workforce platform core (awp)"
requires-python = ">=3.11"
dependencies = [
    "awp",
    "httpx",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The core and its test helpers sit next to the pack in the monorepo.
pythonpath = ["src", "../../core/src", "../../core/tests"]
testpaths = ["tests"]
