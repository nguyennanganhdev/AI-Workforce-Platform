worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $request_uri $landing_cache_control {
        default "no-cache";
        ~^/landing-assets/build/ "public, max-age=31536000, immutable";
        ~^/landing-assets/images/ "public, max-age=86400";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $landing_cache_control always;

        location = / {
            try_files /index.html =404;
        }

        location = /landing-assets/ {
            try_files /index.html =404;
        }

        location ^~ /landing-assets/ {
            rewrite ^/landing-assets/(.*)$ /$1 break;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
