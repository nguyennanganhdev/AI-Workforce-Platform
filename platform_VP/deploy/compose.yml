# The platform on one machine: PostgreSQL, Redis, MinIO, a one-shot migration job and the API.
#
#   cd platform_VP/deploy
#   python init_env.py                 # once: writes .env with fresh secrets (never overwrites one)
#   docker compose build               # the image awp-platform:<AWP_IMAGE_TAG> from ../Dockerfile
#   docker compose up -d               # postgres, redis, minio -> migrate (must succeed) -> api
#   docker compose --profile two up -d     # the same with a second API replica (api2, host port AWP_HOST_PORT2)
#   docker compose --profile demo up -d    # plus a scripted model and a sample MCP server (python smoke.py)
#
# Project name `awp-platform`: containers are awp-platform-<service>-1, volumes awp-platform_<name>.
# Every published port is bound to 127.0.0.1. Put a reverse proxy with TLS in front for anything else.
#
# WHAT IS WIRED: postgres, redis, minio, migrate, api, and api2 (profile `two`). The API processes share the database,
# Redis (AWP_REDIS_URL: session locks, wake-ups, the nudges between processes), the `workspaces` volume and the image
# store (MinIO, AWP_S3_*: the images of clients that were given the capability attach_asset; the API makes the bucket
# when it starts). Any process serves any request, and one that dies is taken over by the others
# (docs/WORKFORCE_V1_VAN_HANH.md sections 11 and 12).
# More replicas are more services like api2 (or any orchestrator that runs the same image with the same environment).
name: awp-platform

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-awp: &awp
  image: awp-platform:${AWP_IMAGE_TAG:-0.3.0}
  env_file: [.env]
  init: true  # reaps the child processes an agent's tools may leave; signals still reach the Python process
  logging: *logging

# One API process. Every replica is this, with its own host port.
x-api: &api
  <<: *awp
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  environment:
    AWP_HOST: 0.0.0.0
    AWP_PORT: "8800"
    AWP_AUTO_CREATE: "0"  # tables come from the migrate job; a database behind the code stops the start
    AWP_WORKSPACE_DIR: /var/lib/awp/workspaces
    AWP_MODELS_FILE: /etc/awp/models.yaml
  volumes:
    - workspaces:/var/lib/awp
    - ${AWP_MODELS_HOST_FILE:?set AWP_MODELS_HOST_FILE in deploy/.env (init_env.py does)}:/etc/awp/models.yaml:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/platform/v1/health', timeout=4).read()"]
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 60s
    start_interval: 2s
  stop_grace_period: 45s  # SIGTERM, then this long for running requests and the engine to stop, then SIGKILL

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "python init_env.py" first (it writes deploy/.env)}
      POSTGRES_DB: awp
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/10-awp-storage.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${AWP_PG_HOST_PORT:-5590}:5432"
    healthcheck:
      # over TCP on purpose: while the image initialises a new data directory its temporary server has no TCP port,
      # so this stays red until both databases exist and the real server is up
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U awp -d awp_storage -Atc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    logging: *logging

  # One shot, before every start of the API: awp's tables, then AgentScope's storage tables with AgentScope's own
  # scripts, then a check that the database is what the code expects. AgentScope's auto_migrate is never used.
  migrate:
    <<: *awp
    pull_policy: never
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "python -m awp migrate --storage && python -m awp migrate --check"]

  # The message bus of the API processes (AWP_REDIS_URL in deploy/.env): AgentScope's session locks, its wake-up queue,
  # and the nudges that make a POST on one replica wake an event stream on another. Not the truth: every workflow,
  # event and operation is in PostgreSQL, and a Redis that lost its data costs running turns, never a workflow.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run "python init_env.py" first (it writes deploy/.env)}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    <<: *api
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AWP_HOST_PORT:-8800}:8800"

  # ---- profile two: a second replica of the API ---------------------------------------------------------------------
  # The same image, environment, database, Redis and workspace volume as `api`, on its own host port. Neither is a
  # leader: a request, a provider event or an event stream may go to either, and when one dies the other takes its
  # running work over after AWP_WF_LEASE_SECONDS.
  api2:
    <<: *api
    profiles: [two]
    pull_policy: never
    ports:
      - "127.0.0.1:${AWP_HOST_PORT2:-8801}:8800"

  # ---- profile demo: no model key needed --------------------------------------------------------------------------
  # A scripted OpenAI-compatible model and a sample partner MCP server, both run from the platform image with the
  # scripts in ./demo. For deploy/smoke.py and for looking around the console; never for production.
  fake-model:
    <<: *awp
    profiles: [demo]
    pull_policy: never
    restart: unless-stopped
    env_file: []
    entrypoint: ["python", "/demo/fake_model.py"]
    volumes: ["./demo:/demo:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/health', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 5s

  fake-mcp:
    <<: *awp
    profiles: [demo]
    pull_policy: never
    restart: unless-stopped
    env_file: []
    environment:
      DEMO_MCP_TOKEN: ${DEMO_MCP_TOKEN:-demo-mcp-token}
    entrypoint: ["python", "/demo/fake_mcp.py"]
    volumes: ["./demo:/demo:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8901/health', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 5s

  # The image store (AWP_S3_* in deploy/.env): the pictures residents send, for clients that were given the capability
  # attach_asset (an extension beyond contract v1). The API makes the bucket when it starts and is the only writer;
  # a partner's tool reads one object through a link the platform signs for a few minutes (AWP_ASSET_URL_TTL). The
  # bucket is private: without such a link nothing is readable. Its own web console (port 9001) is not published.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run "python init_env.py" first (it writes deploy/.env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run "python init_env.py" first (it writes deploy/.env)}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${AWP_MINIO_HOST_PORT:-9190}:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set self http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc ready self"]
      interval: 10s
      timeout: 8s
      retries: 6
    logging: *logging

configs:
  pg_init:
    # the second database (AgentScope's storage); the first, `awp`, is POSTGRES_DB. Runs once, on an empty data directory.
    content: |
      CREATE DATABASE awp_storage OWNER awp;

volumes:
  pgdata:
  workspaces:
  redisdata:
  miniodata:
