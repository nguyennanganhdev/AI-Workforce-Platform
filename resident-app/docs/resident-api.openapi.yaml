openapi: 3.1.0
info:
  title: Resident API — integration proposal (NOT IMPLEMENTED)
  version: 0.1.0-draft
  description: >-
    Proposed P0 API for the resident app. Requires FE/BE/domain agreement.
    Request IDs represent resident-facing Case projections, not individual inbound
    vh_resident_request rows. Confirm/reopen act on the current resolution revision.
    See 01-business-and-data.md and 02-api-contract.md for transaction and visibility rules.
servers:
  - url: /api/domains/vinhomes/resident
security:
  - ResidentSession: []
tags:
  - name: Profile
  - name: Photos
  - name: Requests
paths:
  /me:
    get:
      tags: [Profile]
      operationId: getResidentProfile
      summary: Read the authenticated resident and authorized apartments
      responses:
        '200':
          description: Profile; an empty apartments array is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /photos:
    post:
      tags: [Photos]
      operationId: uploadResidentPhoto
      summary: Upload one private image before binding it to a request
      description: >-
        Validate bytes, decoded dimensions, MIME, size and apartment access.
        Maximum file size 10 MiB; multipart envelope 12 MiB. Only return ready
        after storage and metadata succeed. Retry uses the same key and file bytes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, apartmentId]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPG, PNG or WebP; max 10485760 bytes.
                apartmentId:
                  $ref: '#/components/schemas/Id'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Stored and ready; not yet attached to a Case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /requests:
    get:
      tags: [Requests]
      operationId: listResidentRequests
      summary: List caller-visible Cases as resident request summaries
      description: Sort by createdAt DESC, id DESC. Filtering never expands authorization scope.
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, open, completed]
            default: all
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: apartmentId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One scoped page. No total count is promised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Requests]
      operationId: createResidentRequest
      summary: Explicitly submit a reviewed resident draft
      description: >-
        Atomically create Case, inbound submission, authorized photo bindings,
        public event, outbox and idempotency receipt. Actor/tenant derive from
        trusted context. Do not wait for an LLM or require an Incident at intake.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
            example:
              apartmentId: apt-s202-1208
              description: Vòi nước dưới bồn rửa bị rò, nước chảy ra sàn.
              location:
                description: Bếp, dưới bồn rửa căn hộ 1208
              photoIds: [file-01]
      responses:
        '201':
          description: Accepted into the staff intake queue, with a stable Case ID.
          headers:
            Location:
              description: Relative path to the newly created resident request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Requests]
      operationId: getResidentRequest
      summary: Read the public projection and authorized images of one Case
      parameters:
        - name: eventsCursor
          in: query
          description: >-
            Opaque cursor for the next page of public timeline, ordered at ASC,
            id ASC. Each page includes a current request snapshot. Reset pagination
            when the request version changes; deduplicate events by ID.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/RequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /requests/{requestId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      operationId: confirmResidentResolution
      summary: Accept the current public resolution of this Case
      description: >-
        Requires confirmation state, matching version/revision and actor authority.
        Does not replace QC or unconditionally close a shared Incident/another Case.
        Authorize replay before returning a previous receipt; replay an identical
        command before evaluating state/version guards a second time.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionCommand'
            example:
              expectedVersion: 8
              resolutionRevision: res-02
      responses:
        '200':
          $ref: '#/components/responses/RequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /requests/{requestId}/reopen:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Requests]
      operationId: requestResidentRework
      summary: Request a review of unresolved issues in the current resolution
      description: >-
        P0 accepts only from confirmation, NOT completed. Record the reason against
        this Case/revision and return processing. Route to staff review; do not
        blindly reopen all shared Incidents or grant work execution automatically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReworkCommand'
            example:
              expectedVersion: 8
              resolutionRevision: res-02
              reason: Sau khi mở vòi, nước vẫn bị rò ở khớp nối.
      responses:
        '200':
          $ref: '#/components/responses/RequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ResidentSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Reuse the configured Better Auth session and trusted domain membership.
        This logical cookie name must be checked against deployment settings,
        including secure prefixes. FE uses credentials/include, not a JS-readable
        session token. Mutations require CSRF protection/allowed Origin enforcement.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      description: Stable Case projection ID, not the human-readable request code.
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One stable key per intended command/payload; keep across network retries.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
    DateTime:
      type: string
      format: date-time
    Status:
      type: string
      enum: [received, processing, confirmation, completed]
    Profile:
      type: object
      additionalProperties: false
      required: [user, apartments, limits]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            displayName:
              type: string
        apartments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, label, projectId, projectName, towerId]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              label:
                type: string
              projectId:
                $ref: '#/components/schemas/Id'
              projectName:
                type: string
              towerId:
                $ref: '#/components/schemas/Id'
        limits:
          type: object
          additionalProperties: false
          required: [maxPhotosPerRequest, maxPhotoBytes, allowedPhotoTypes]
          properties:
            maxPhotosPerRequest:
              type: integer
              const: 3
            maxPhotoBytes:
              type: integer
              const: 10485760
            allowedPhotoTypes:
              type: array
              items:
                type: string
                enum: [image/jpeg, image/png, image/webp]
    Photo:
      type: object
      additionalProperties: false
      required: [id, name, url, urlExpiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        url:
          type: string
          format: uri
          description: Short-lived private read URL; never use it as file identity.
        urlExpiresAt:
          $ref: '#/components/schemas/DateTime'
    UploadedPhoto:
      type: object
      additionalProperties: false
      required: [id, name, url, urlExpiresAt, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        url:
          type: string
          format: uri
        urlExpiresAt:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          const: ready
    CreateRequest:
      type: object
      additionalProperties: false
      required: [apartmentId, description, location, photoIds]
      properties:
        apartmentId:
          $ref: '#/components/schemas/Id'
        description:
          type: string
          minLength: 8
          maxLength: 5000
          description: Validate after trimming whitespace.
        location:
          type: object
          additionalProperties: false
          required: [description]
          properties:
            description:
              type: string
              minLength: 3
              maxLength: 500
        photoIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    RequestSummary:
      type: object
      additionalProperties: false
      required: [id, code, title, status, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        title:
          type: string
          maxLength: 90
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
          minimum: 1
    RequestPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RequestSummary'
        nextCursor:
          type: [string, 'null']
    PublicEvent:
      type: object
      additionalProperties: false
      required: [id, label, at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        at:
          $ref: '#/components/schemas/DateTime'
        note:
          type: string
          description: Sanitized public content only, never internal staff notes.
    Resolution:
      type: [object, 'null']
      additionalProperties: false
      required: [summary, publishedAt, photos]
      properties:
        summary:
          type: string
        publishedAt:
          $ref: '#/components/schemas/DateTime'
        photos:
          type: array
          description: Result photos approved for this resident to see; distinct from intake photos.
          items:
            $ref: '#/components/schemas/Photo'
    RequestView:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - title
        - description
        - apartmentId
        - location
        - status
        - createdAt
        - updatedAt
        - version
        - photos
        - events
        - eventsNextCursor
        - resolutionRevision
        - resolution
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
        title:
          type: string
          maxLength: 90
        description:
          type: string
        apartmentId:
          $ref: '#/components/schemas/Id'
        location:
          type: string
          description: Display text derived from authorized property and submitted location.
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
          minimum: 1
        photos:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Photo'
        events:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PublicEvent'
        eventsNextCursor:
          type: [string, 'null']
        resolutionRevision:
          type: [string, 'null']
          description: Required non-null when status is confirmation; immutable ID of the published result revision.
        resolution:
          $ref: '#/components/schemas/Resolution'
        permissions:
          type: object
          additionalProperties: false
          required: [canConfirm, canRequestRework]
          properties:
            canConfirm:
              type: boolean
            canRequestRework:
              type: boolean
      allOf:
        - if:
            properties:
              status:
                const: confirmation
          then:
            properties:
              resolutionRevision:
                $ref: '#/components/schemas/Id'
              resolution:
                type: object
    ResolutionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, resolutionRevision]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        resolutionRevision:
          $ref: '#/components/schemas/Id'
    ReworkCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion, resolutionRevision, reason]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        resolutionRevision:
          $ref: '#/components/schemas/Id'
        reason:
          type: string
          minLength: 8
          maxLength: 2000
          description: Validate after trimming whitespace.
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
  responses:
    RequestDetail:
      description: Current public Case projection; commands return the first page of timeline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RequestView'
    BadRequest:
      description: Malformed input, invalid cursor or required header missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Session missing or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient apartment membership, command authority or CSRF/Origin validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Request/photo not found or not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: VERSION_CONFLICT, RESOLUTION_CHANGED, INVALID_STATE or IDEMPOTENCY_CONFLICT.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: File or request body exceeds its respective limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: Unsupported image type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Payload validation failed, unknown field, invalid image or PHOTO_NOT_READY.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limited; retry no earlier than Retry-After.
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Service/storage unavailable; no fabricated success response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
