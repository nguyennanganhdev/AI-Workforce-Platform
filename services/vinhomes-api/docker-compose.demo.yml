services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - .local-v3-faker/postgres.env
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - faker-v3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinhomes_seed -d vinhomes_v3"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  faker-v3-data:
